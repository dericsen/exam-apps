<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ujian Berlangsung</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- Gerbang masuk: fullscreen butuh gesture user, jadi tidak bisa otomatis. -->
<div class="overlay" id="gate">
  <div class="overlay-box">
    <h2 id="gateTitle">Masuk ke ujian</h2>
    <p class="dim" id="gateMsg">Memuat data ujian...</p>
    <div id="gateError" class="msg err hidden"></div>
    <dl class="kv" id="gateInfo" style="margin-bottom:1rem"></dl>
    <button id="gateBtn" class="primary block" disabled>Memuat...</button>
    <p class="small dim" style="margin:.7rem 0 0">
      Layar akan masuk mode penuh. Timer sudah berjalan sejak kamu enroll.
    </p>
  </div>
</div>

<div id="examRoot" class="hidden">
  <div class="topbar">
    <div class="who">
      <div id="pName">-</div>
      <span id="pMeta"></span>
    </div>
    <div class="parttabs" id="partTabs">
      <button data-part="tpks" class="active">TPKS</button>
      <button data-part="cp">CP</button>
    </div>
    <div class="grow"></div>
    <span class="tag hidden" id="offlineTag">koneksi terputus</span>
    <span class="tag warn hidden" id="violTag"></span>
    <span class="dim small">sisa</span>
    <span id="timer">--:--</span>
    <button id="finishBtn">Selesai &amp; kumpulkan</button>
  </div>
  <div class="main" id="mainArea"></div>
</div>

<template id="tplTpks">
  <div class="qnav">
    <div class="row between small" style="margin-bottom:.4rem">
      <b>Soal</b><span class="dim" id="answeredInfo"></span>
    </div>
    <div class="qgrid" id="qgrid"></div>
    <p class="small dim" style="margin-top:.7rem">
      Kotak bertanda hijau sudah dijawab. Pintasan: A-D atau 1-4 untuk menjawab,
      panah kiri/kanan untuk berpindah.
    </p>
  </div>
  <div class="qpane">
    <div class="qpane-inner">
      <div class="row between small dim">
        <span id="qCounter"></span><span id="qType"></span>
      </div>
      <div class="qtext" id="qText"></div>
      <div class="opts" id="qOpts"></div>
      <div class="row" style="margin-top:1.3rem">
        <button id="prevBtn">&larr; Sebelumnya</button>
        <button id="nextBtn">Berikutnya &rarr;</button>
        <div class="grow"></div>
        <button class="sm" id="clearBtn">Hapus jawaban</button>
      </div>
    </div>
  </div>
</template>

<template id="tplCp">
  <div class="cp-col">
    <div class="cp-tabs" id="cpTabs"></div>
    <div class="cp-body">
      <div class="statement" id="statement"></div>
      <div class="editor-col">
        <div class="editor-bar">
          <select id="langSelect" title="Bahasa pemrograman"></select>
          <span class="tag" id="draftStatus"></span>
          <div class="grow"></div>
          <button class="sm" id="resetCodeBtn">Reset kode</button>
          <button class="sm" id="runBtn">Uji contoh</button>
          <button class="sm primary" id="submitCodeBtn">Submit &amp; nilai</button>
        </div>
        <div class="editor-shell">
          <div class="gutter" id="gutter">1</div>
          <textarea id="codeArea" data-allow-editing="true" spellcheck="false"
                    autocomplete="off" autocapitalize="off" wrap="off"></textarea>
        </div>
        <div class="console">
          <div class="console-head">
            <span id="consoleTitle">Hasil</span>
            <div class="grow"></div>
            <label><input type="checkbox" id="customToggle"> input manual</label>
          </div>
          <div class="console-body" id="consoleBody">
            <p class="dim small">
              <b>Uji contoh</b> menjalankan kodemu pada contoh kasus di soal. Tidak dinilai.<br>
              <b>Submit &amp; nilai</b> menjalankan test case tersembunyi yang datanya
              berbeda dari contoh. Inilah yang menentukan nilaimu, jadi pastikan
              solusimu benar secara umum &mdash; bukan hanya cocok untuk contoh.
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<template id="tplDone">
  <div class="wrap">
    <h1 id="doneTitle">Ujian selesai</h1>
    <p class="dim" id="doneMsg"></p>
    <div id="doneDetail"></div>
    <p class="small dim">Kamu boleh menutup jendela ini. Tunggu arahan pengawas.</p>
  </div>
</template>

<script src="js/api.js"></script>
<script src="js/lockdown.js"></script>
<script src="js/exam.js"></script>
</body>
</html>
